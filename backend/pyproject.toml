[project]
name = "xe6-backend"
version = "0.1.0"
description = "XE6-07 一站式 3D 打印系统后端"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "structlog>=24.4",
    "email-validator>=2.2",
    "python-jose[cryptography]>=3.3",
    # passlib 1.7.4 的 bcrypt backend 无法初始化 bcrypt 5.x（读取已移除的
    # bcrypt.__about__ 报错），因此把 bcrypt 钉在 <5.0。见 security 的哈希往返测试。
    "passlib>=1.7",
    "bcrypt>=4.0,<5.0",
    "python-multipart>=0.0.12",
    # 任务编排：骨架阶段强制 eager 内联执行，不连接 Redis；真实部署再启用队列。
    "redis>=5.2",
    "celery[redis]>=5.4",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "httpx>=0.27",
    "types-python-jose>=3.3",
    "types-passlib>=1.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC", "S", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# 测试里 assert、以及断言/构造 token 字面量属正常用法。
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

# celery 不随发行版提供类型存根（无 py.typed），不因其导入而报错。
[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
